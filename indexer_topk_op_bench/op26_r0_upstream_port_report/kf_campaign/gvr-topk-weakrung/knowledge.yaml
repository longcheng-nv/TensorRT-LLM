# knowledge.yaml — declarative skills + /context selection for Kernel Factory agents.
#
# Generated by `kf campaign init` from the deployed agent image's /inventory.json.
# Edit by deleting lines you don't want; campaign.yaml already references this file.
# To reuse this file in another workspace, pass:
#
#   kf campaign init my-campaign --knowledge-file ./knowledge.yaml
#
# Mental model:
#   * Kernel Factory always installs harness skills: query, submit, cudagym, insights.
#   * `skills:`    selects optional/domain skills in addition to that harness.
#   * Omit `contexts:` to receive all built-in contexts by default.
#   * Set `contexts: []` to remove all built-in context dirs/files.
#   * Otherwise `contexts:` is the exact list exposed under /context/.
# Strings are built-in items. Objects can point at external Git
# repos for custom skills or contexts. External skills cannot replace harness
# skill names.
# See docs/reference/AGENT_KNOWLEDGE.md for the full design.
# ---------------------------------------------------------------------------


