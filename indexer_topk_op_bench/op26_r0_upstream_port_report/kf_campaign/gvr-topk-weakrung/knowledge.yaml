  - hw-blackwell-geforce    # Hardware reference for NVIDIA Blackwell GeForce / RTX PRO 6000 (GB202, SM120, compute capability 12.0, sm_120).
  - hw-hopper               # Hardware reference for NVIDIA Hopper GPUs (H100, H200; SM90).
  - hw-rubin                # Expert knowledge on the NVIDIA Rubin (GR100/GR212) GPU architecture, the successor to Blackwell.
  - kernel-factory-schemas  # Kernel Factory input/output schema reference (SOLBench / FlashInfer-Bench format) for GPU kernel benchmarking.
  - lang-cuda-c-ptx         # CUDA Tensor Core kernel development for Hopper (WGMMA) and Blackwell (Gen5/tcgen05).
  - lang-cutedsl            # Help write, debug, and optimize GPU kernels using NVIDIA's CuTe DSL (Python).
  - lang-cutile             # Comprehensive documentation and working examples for NVIDIA cuTile Python, a tile-based parallel programming …
  - lang-cutlass-ir         # Conceptual compiler/IR reference for how CuTe DSL lowers through the cutlass_ir compiler (CuTe MLIR dialect →…
  - lang-lir                # Help write, debug, and optimize GPU kernels using the LIR (Low-level Intermediate Representation) DSL — the e…
  - lang-ptx-reference      # Analyze PTX assembly code for NVIDIA GPUs, understanding instruction semantics and identifying performance bo…
  - report-bug              # Report infrastructure bugs/errors to the platform API for operator visibility.
  - skill-creator           # Create new skills, modify and improve existing skills, and measure skill performance.
  - summarize               # Fetch a round's full agent activity and publish a meta-summary to the platform.
  - wf-kernelgen            # Produce a GPU kernel for a SOL-Bench problem — a fresh build OR a port of an existing kernel — in any support…
  - wf-optimize             # Improve the performance of an ALREADY-CORRECT GPU kernel (any language: CuTe DSL, LIR, CUDA-C, cuTile).
  - wf-router               # Language- and architecture-agnostic knowledge-base router.
  - wf-validate             # The rules every generated kernel must satisfy (anti-cheat, DPS run() contract, working hygiene, frozen-skill …

