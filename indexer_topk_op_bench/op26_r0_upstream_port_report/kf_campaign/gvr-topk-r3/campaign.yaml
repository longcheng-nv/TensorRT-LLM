# Composite-fitness weights. Uncomment + edit to override the server-side
# WeightConfig::default. Each weight must be finite and non-negative; the
# sum must be > 0. Sums other than 1.0 are allowed but produce an
# unnormalized composite score (the CLI prints a warning at `start`).
# fitness_weights:
#   performance: 0.4
#   correctness: 0.3
#   efficiency: 0.2
#   novelty: 0.1

