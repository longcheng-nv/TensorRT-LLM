# campaign.yaml - generated by `kf campaign init`
# Prepare with: kf campaign prepare --from campaign.yaml
# Start with:   kf campaign start --from campaign.yaml --watch
# name is a reusable friendly display name; start prints the explicit campaign id.
name: gvr-topk-r3
definition: ./definition.json
workloads: ./workload.jsonl
effort: high
language: cuda_cpp
prompt_file: ./prompt.md
baselines: ./baselines.jsonl
# The agent_pool below is the Kernel Factory team's recommended default for
# your chosen --effort tier. It's a solid starting point — keep it as-is, or
# edit any entry (or uncomment an alternative below) for a custom setup.
agent_pool:
- runtime: claude
  model: fable-5
  count: 2
  reasoning_effort: high
- runtime: codex
  model: gpt-5.6-sol
  count: 2
  reasoning_effort: high
- runtime: n3
  model: claude-opus-4-8
  count: 2
# Other runtimes/models to swap in (sum(count) is the agents-per-round, max 10).
# Uncomment/adjust any entry — Claude, Codex, and AVO/N3 are all valid:
#   - runtime: claude          # Claude Code SDK
#     model: fable-5           # or opus-4.8, opus-4.7[1m], opus-4.6
#     count: 2
#     reasoning_effort: high   # low | medium | high | xhigh | max
#   - runtime: codex           # Codex CLI via NVIDIA Inference Hub
#     model: gpt-5.6-sol       # or gpt-5.6-terra, gpt-5.6-luna, gpt-5.5
#     count: 2
#     reasoning_effort: high   # low | medium | high | xhigh (no max)
#   - runtime: n3              # AVO/N3 crew runtime
#     model: claude-opus-4-8   # or claude-opus-4-6, claude-opus-4-5
#     count: 2                 # n3 takes no reasoning_effort
max_rounds: 20
max_duration: 28800
# Cumulative optimizer + summarizer LLM spend cap in USD (default: 8000).
# Checked before the summarizer and again before the next round; a paid step may overshoot.
max_cost_usd: 800.0
stagnation_limit: 4
convergence_threshold: null
agent_timeout: null
eval_timeout: 600
max_turns: null
gpu_spec: b200
# Exact BYOE path beneath CudaGym environments/, not a shell env var.
# Use <owner>/<environment> (for example kernels-team/flashinfer-hopper); requires gpu_spec and conflicts with gpu_endpoint.
environment: null
gpu_endpoint: null
artifact_id: null
